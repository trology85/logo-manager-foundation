<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>LOGO MANAGER PRO - V5 ELITE</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root { --main-red: #ff0000; --bg-dark: #0a0a0a; --card-bg: #161616; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-dark); color: white; margin: 0; overflow: hidden; }

        /* GİRİŞ PERDESİ */
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; transition: 0.5s;
        }
        .lock-box { background: #1a1a1a; padding: 40px; border-radius: 20px; border-top: 4px solid var(--main-red); text-align: center; width: 350px; }
        .token-input { width: 100%; padding: 12px; background: #222; border: 1px solid #333; color: white; border-radius: 8px; margin-bottom: 15px; text-align: center; box-sizing: border-box; }
        
        /* ANA PANEL */
        #mainPanel { display: flex; height: 100vh; filter: blur(15px); pointer-events: none; transition: 0.5s; }
        .sidebar { width: 260px; background: #000; padding: 20px; border-right: 1px solid #222; display: flex; flex-direction: column; }
        .main-content { flex: 1; overflow-y: auto; padding: 30px; }
        
        .nav-btn { background: none; border: none; color: #666; padding: 15px; text-align: left; cursor: pointer; border-radius: 10px; margin-bottom: 5px; width: 100%; transition: 0.3s; }
        .nav-btn.active { background: #1a1a1a; color: white; border-left: 5px solid var(--main-red); }
        
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        .logo-card { background: var(--card-bg); padding: 15px; border-radius: 15px; text-align: center; border: 1px solid #222; position: relative; transition: 0.3s; }
        .logo-card:hover { border-color: var(--main-red); transform: translateY(-5px); }
        .logo-card img { width: 90px; height: 90px; object-fit: contain; margin-bottom: 10px; }
        .select-check { position: absolute; top: 10px; left: 10px; width: 18px; height: 18px; cursor: pointer; }

        .btn-action { background: var(--main-red); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-green { background: #28a745; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        
        #multiDeleteBar { display: none; position: sticky; top: 0; z-index: 100; background: #ff0000; color: white; padding: 12px; border-radius: 8px; margin-bottom: 15px; justify-content: space-between; align-items: center; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="lock-box">
            <h2 style="color:red">YETKİLİ GİRİŞİ</h2>
            <input type="password" id="entryToken" class="token-input" placeholder="GitHub Token Girin">
            <button class="btn-action" onclick="unlock()">SİSTEMİ AÇ</button>
        </div>
    </div>

    <div id="mainPanel">
        <div class="sidebar">
            <h2 style="color:red; text-align:center; letter-spacing:2px;">LOGO PRO</h2>
            <button class="nav-btn active" onclick="showTab('tab-upload', this)">📤 Çoklu Yükle</button>
            <button class="nav-btn" onclick="showTab('tab-library', this)">📂 Kütüphane</button>
            <div style="margin-top: auto;">
                <button id="publishBtn" class="btn-green" onclick="publishJson()">SİSTEMİ YAYINLA</button>
                <p onclick="logout()" style="text-align:center; color:#444; cursor:pointer; font-size:12px; margin-top:10px;">Güvenli Çıkış</p>
            </div>
        </div>

        <div class="main-content">
            <div id="multiDeleteBar">
                <span id="selectedCount">0 seçildi</span>
                <button onclick="deleteSelected()" style="background:white; color:red; border:none; padding:5px 10px; border-radius:5px; font-weight:bold; cursor:pointer;">SEÇİLENLERİ SİL</button>
            </div>

            <div id="tab-upload" class="tab-content active">
                <h1>Yeni Logolar Ekle</h1>
                <div style="border: 3px dashed #333; padding: 60px; text-align:center; border-radius:20px; cursor:pointer;" onclick="document.getElementById('fileInput').click()">
                    <h2 id="statusText" style="color:#555">Dosyaları buraya bırakın</h2>
                    <input type="file" id="fileInput" multiple style="display:none" onchange="handleMultipleUpload(this.files)">
                </div>
            </div>

            <div id="tab-library" class="tab-content">
                <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom:20px;">
                    <h1>Kütüphane</h1>
                    <div style="display:flex; gap:10px;">
                        <input type="text" id="searchInput" placeholder="Ara..." onkeyup="loadLogos()" style="background:#222; border:1px solid #333; color:white; padding:8px; border-radius:5px;">
                        <select id="sortOrder" onchange="loadLogos()" style="background:#222; color:white; border-radius:5px; padding:5px;">
                            <option value="name_asc">A-Z</option>
                            <option value="date_desc">En Yeni</option>
                        </select>
                    </div>
                </div>
                <div id="gridContainer" class="grid-container"></div>
            </div>
        </div>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY", // Buraya kendi API key'ini koymayı unutma usta
        authDomain: "logo-server-fixed.firebaseapp.com",
        projectId: "logo-server-fixed",
        storageBucket: "logo-server-fixed.firebasestorage.app",
        messagingSenderId: "822558792997",
        appId: "1:822558792997:web:b83cb53311bb68bbb68ecc"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const GITHUB_USER = "trology85";
    const GITHUB_REPO = "logo-manager-foundation";

    function unlock() {
        const t = document.getElementById('entryToken').value;
        if(t.startsWith("ghp_")) {
            localStorage.setItem('gh_token', t);
            document.getElementById('loginOverlay').style.display = "none";
            document.getElementById('mainPanel').style.filter = "none";
            document.getElementById('mainPanel').style.pointerEvents = "all";
            loadLogos();
        } else { alert("Geçersiz Token!"); }
    }

    function logout() { localStorage.removeItem('gh_token'); location.reload(); }

    window.onload = () => {
        const t = localStorage.getItem('gh_token');
        if(t) { document.getElementById('entryToken').value = t; unlock(); }
    };

    function showTab(id, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }

    async function handleMultipleUpload(files) {
        const token = localStorage.getItem('gh_token');
        const status = document.getElementById('statusText');
        for (let file of files) {
            status.innerText = "Yükleniyor: " + file.name;
            const reader = new FileReader();
            await new Promise(resolve => {
                reader.readAsDataURL(file);
                reader.onload = async () => {
                    const content = reader.result.split(',')[1];
                    const path = "logos/" + file.name;
                    const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`, {
                        method: "PUT", headers: { "Authorization": `token ${token}` },
                        body: JSON.stringify({ message: "Upload", content: content })
                    });
                    if(res.ok) {
                        await db.collection("logoListesi").add({
                            name: file.name.split('.')[0].toUpperCase(),
                            url: `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${path}`,
                            tarih: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }
                    resolve();
                };
            });
        }
        status.innerText = "TAMAMLANDI!";
        setTimeout(() => location.reload(), 1500);
    }

    function loadLogos() {
        const order = document.getElementById('sortOrder').value;
        const search = document.getElementById('searchInput').value.toUpperCase();
        let q = db.collection("logoListesi");
        q = (order === "name_asc") ? q.orderBy("name", "asc") : q.orderBy("tarih", "desc");
        
        q.onSnapshot(s => {
            const container = document.getElementById('gridContainer');
            container.innerHTML = "";
            s.forEach(doc => {
                const d = doc.data();
                if(d.name.includes(search)) {
                    container.innerHTML += `
                    <div class="logo-card">
                        <input type="checkbox" class="select-check" value="${doc.id}" onchange="updateSelection()">
                        <img src="${d.url}"><p>${d.name}</p>
                    </div>`;
                }
            });
        });
    }

    let selectedIds = [];
    function updateSelection() {
        selectedIds = Array.from(document.querySelectorAll('.select-check:checked')).map(c => c.value);
        document.getElementById('multiDeleteBar').style.display = selectedIds.length ? 'flex' : 'none';
        document.getElementById('selectedCount').innerText = selectedIds.length + " seçildi";
    }

    async function deleteSelected() {
        if(!confirm("Silinsin mi?")) return;
        for(let id of selectedIds) { await db.collection("logoListesi").doc(id).delete(); }
        updateSelection();
    }

    async function publishJson() {
        const token = localStorage.getItem('gh_token');
        const btn = document.getElementById('publishBtn');
        btn.innerText = "YAYINLANIYOR...";
        const snap = await db.collection("logoListesi").orderBy("name", "asc").get();
        let list = [];
        snap.forEach(doc => { 
            const d = doc.data(); 
            list.push({ name: d.name, url: d.url, rev: "rev=1" }); 
        });

        const fileName = "logolar.json";
        const content = btoa(unescape(encodeURIComponent(JSON.stringify(list, null, 2))));
        
        const getFile = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${fileName}`, {
            headers: { "Authorization": `token ${token}` }
        });
        let sha = "";
        if(getFile.ok) { const f = await getFile.json(); sha = f.sha; }

        await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${fileName}`, {
            method: "PUT", headers: { "Authorization": `token ${token}` },
            body: JSON.stringify({ message: "Update", content: content, sha: sha })
        });
        alert("logolar.json güncellendi!");
        btn.innerText = "SİSTEMİ YAYINLA";
    }
</script>
</body>
</html>
