<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>LOGO MANAGER PRO - V10.1 WORKING</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/trology85/logo-manager-foundation/main/panel-logo.png">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root { --main-accent: #ff0000; --bg-dark: #0a0a0a; --card-bg: #161616; --text-color: #ffffff; --sidebar-bg: #000000; --border-color: #222222; --input-bg: #1a1a1a; --overlay-bg: rgba(0,0,0,0.95); }
        body.light-mode { --bg-dark: #f0f2f5; --card-bg: #ffffff; --text-color: #1a1a1a; --sidebar-bg: #ffffff; --border-color: #dddfe2; --input-bg: #f5f6f7; --overlay-bg: rgba(255,255,255,0.95); }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-dark); color: var(--text-color); margin: 0; overflow: hidden; transition: 0.3s; }
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .lock-box { background: #111; padding: 50px; border-radius: 35px; border-top: 5px solid var(--main-accent); text-align: center; width: 380px; }
        .token-input { width: 100%; padding: 15px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 12px; margin-bottom: 20px; text-align: center; }
        #mainPanel { display: flex; height: 100vh; opacity: 0; transition: 1s; }
        .sidebar { width: 280px; background: var(--sidebar-bg); padding: 25px; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .main-content { flex: 1; overflow-y: auto; padding: 40px; background: var(--bg-dark); }
        .nav-btn { background: none; border: none; color: #777; padding: 16px; text-align: left; cursor: pointer; border-radius: 12px; margin-bottom: 8px; font-weight: 600; transition: 0.2s; }
        .nav-btn:hover { color: white; background: rgba(255,0,0,0.1); }
        .nav-btn.active { background: var(--main-accent); color: white !important; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        .logo-card { background: var(--card-bg); padding: 15px; border-radius: 15px; text-align: center; border: 1px solid var(--border-color); position: relative; }
        .logo-card img { width: 80px; height: 80px; object-fit: contain; margin-bottom: 10px; border-radius: 8px; }
        .select-check { position: absolute; top: 10px; left: 10px; width: 18px; height: 18px; accent-color: var(--main-accent); cursor: pointer; }
        .btn-action { background: var(--main-accent); color: white; border: none; padding: 12px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .btn-green { background: #1db954; color: white; border: none; padding: 12px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--overlay-bg); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 10001; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--main-accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .inspect-card { background: var(--card-bg); border-radius: 15px; padding: 15px; display: flex; align-items: center; gap: 20px; margin-bottom: 10px; border-left: 5px solid var(--main-accent); }
    </style>
</head>
<body>

    <div id="loader"><div class="spinner"></div><p id="loaderText" style="margin-top:15px;">İşlem Yapılıyor...</p></div>

    <div id="mainPanel">
        <div class="sidebar">
            <img src="https://raw.githubusercontent.com/trology85/logo-manager-foundation/main/panel-logo.png" style="width:80px; margin:0 auto 20px auto;">
            <button class="nav-btn active" onclick="showTab('tab-upload', this)">📤 Çoklu Yükle</button>
            <button class="nav-btn" onclick="showTab('tab-library', this)">📂 Tüm Arşiv</button>
            <button class="nav-btn" onclick="showTab('tab-detective', this)">🔍 M3U Dedektifi</button>
            <button class="nav-btn" onclick="showTab('tab-licenses', this)">🔐 Lisans Merkezi</button>
            <button class="nav-btn" onclick="showTab('tab-inspector', this)">📏 Logo Müfettişi</button>
            <button class="nav-btn" onclick="showTab('tab-settings', this)">⚙️ Ayarlar</button>
            
            <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border-color);">
                <button class="btn-green" style="width:100%" onclick="saveChanges()">DEĞİŞİKLİKLERİ KAYDET</button>
                <p onclick="logout()" style="text-align:center; color:#555; cursor:pointer; font-size:11px; margin-top:10px;">Güvenli Çıkış</p>
            </div>
        </div>

        <div class="main-content">
            <div id="tab-upload">
                <h1>📤 Yeni Logo Ekle</h1>
                <div style="border: 2px dashed var(--border-color); padding: 80px; text-align:center; border-radius:20px; cursor:pointer;" onclick="document.getElementById('fileInput').click()">
                    <h2 style="color:#555;">Dosyaları Seç veya Buraya Bırak</h2>
                    <input type="file" id="fileInput" multiple accept="image/*" style="display:none" onchange="handleUpload(this.files)">
                </div>
                <div id="uploadPreview" class="grid-container" style="margin-top:20px;"></div>
            </div>

            <div id="tab-library" style="display:none;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h1>📂 Arşiv <small id="syncStatus"></small></h1>
                    <div style="display:flex; gap:10px;">
                        <select id="sortSelect" onchange="sortLogos()" style="background:#1a1a1a; color:white; border:1px solid #333; padding:8px; border-radius:8px;">
                            <option value="az">A'dan Z'ye</option>
                            <option value="za">Z'den A'ya</option>
                            <option value="new">En Yeni</option>
                            <option value="old">En Eski</option>
                        </select>
                        <button id="delBtn" class="btn-action" style="background:gray; display:none;" onclick="deleteSelected()">SEÇİLENLERİ SİL</button>
                    </div>
                </div>
                <div id="githubGrid" class="grid-container"></div>
            </div>

            <div id="tab-inspector" style="display:none;">
                <h1>📏 Logo Müfettişi</h1>
                <button class="btn-action" onclick="inspectArchive()">TARAMAYI BAŞLAT</button>
                <div id="inspectorResult" style="margin-top:20px;"></div>
            </div>

            <div id="tab-detective" style="display:none;">
                <h1>🔍 M3U Dedektifi</h1>
                <input type="file" id="m3uInput" accept=".m3u" style="margin-bottom:20px;">
                <button class="btn-action" onclick="processM3U()">MÜHÜRLE</button>
                <div id="detectiveResult" style="margin-top:20px;"></div>
            </div>

            <div id="tab-licenses" style="display:none;">
                <h1>🔐 Lisanslar</h1>
                <button class="btn-green" onclick="createNewLicense()">+ YENİ</button>
                <div id="licenseList" style="margin-top:20px;"></div>
            </div>
        </div>
    </div>

    <div id="loginOverlay">
        <div class="lock-box">
            <h2 style="color:red;">SİSTEM KİLİTLİ</h2>
            <input type="password" id="entryToken" class="token-input" placeholder="GitHub Token">
            <button class="btn-action" onclick="unlock()">GİRİŞ</button>
        </div>
    </div>

<script>
    const GITHUB_USER = "trology85";
    const GITHUB_REPO = "logo-manager-foundation";
    const firebaseConfig = { apiKey: "AIzaSyDMgOE-RvyqOpNGLM9w6kWzofsCCB8BB54", authDomain: "logo-server-fixed.firebaseapp.com", projectId: "logo-server-fixed", storageBucket: "logo-server-fixed.firebasestorage.app", messagingSenderId: "822558792997", appId: "1:822558792997:web:b83cb53311bb68bbb68ecc" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    
    let manifestData = [];
    let pendingFiles = [];

    async function unlock() {
        const t = document.getElementById('entryToken').value;
        if(t.length > 20) {
            localStorage.setItem('gh_token', t);
            document.getElementById('loginOverlay').style.display = "none";
            document.getElementById('mainPanel').style.opacity = "1";
            loadManifest();
        }
    }

    async function loadManifest() {
        showLoader("Veriler Çekiliyor...");
        const t = localStorage.getItem('gh_token');
        const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/logolar.json`, {
            headers: { "Authorization": `token ${t}` }
        });
        if(res.ok) {
            const json = await res.json();
            manifestData = JSON.parse(atob(json.content));
            renderGrid(manifestData);
        }
        hideLoader();
    }

    function renderGrid(data) {
        const grid = document.getElementById('githubGrid');
        grid.innerHTML = data.map(f => `
            <div class="logo-card">
                <input type="checkbox" class="select-check" value="${f.name}" onchange="toggleDelBtn()">
                <img src="${f.url}">
                <p>${f.name}</p>
            </div>
        `).join('');
        document.getElementById('syncStatus').innerText = `(${data.length})`;
    }

    function handleUpload(files) {
        const preview = document.getElementById('uploadPreview');
        Array.from(files).forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => {
                pendingFiles.push({ name: file.name, content: e.target.result.split(',')[1] });
                preview.innerHTML += `<div class="logo-card"><img src="${e.target.result}"><p>${file.name}</p></div>`;
            };
            reader.readAsDataURL(file);
        });
    }

    async function saveChanges() {
        showLoader("GitHub Güncelleniyor...");
        const t = localStorage.getItem('gh_token');

        // 1. Yeni resimleri yükle
        for(let file of pendingFiles) {
            await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/logos/${file.name}`, {
                method: "PUT",
                headers: { "Authorization": `token ${t}`, "Content-Type": "application/json" },
                body: JSON.stringify({ message: "Logo Upload", content: file.content })
            });
            manifestData.push({ name: file.name.split('.')[0], url: `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/logos/${file.name}` });
        }

        // 2. JSON'u güncelle
        const getSha = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/logolar.json`, {
            headers: { "Authorization": `token ${t}` }
        });
        const shaData = await getSha.json();

        await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/logolar.json`, {
            method: "PUT",
            headers: { "Authorization": `token ${t}` },
            body: JSON.stringify({
                message: "Manifest Update",
                content: btoa(unescape(encodeURIComponent(JSON.stringify(manifestData, null, 2)))),
                sha: shaData.sha
            })
        });

        pendingFiles = [];
        document.getElementById('uploadPreview').innerHTML = "";
        alert("Başarıyla Kaydedildi!");
        loadManifest();
    }

    async function deleteSelected() {
        if(!confirm("Silmek istediğine emin misin?")) return;
        const selected = Array.from(document.querySelectorAll('.select-check:checked')).map(cb => cb.value);
        manifestData = manifestData.filter(m => !selected.includes(m.name));
        saveChanges();
    }

    async function inspectArchive() {
        const resDiv = document.getElementById('inspectorResult');
        resDiv.innerHTML = "Tarama Başladı...";
        let html = "";
        for(let item of manifestData) {
            const img = new Image();
            img.src = item.url;
            const promise = new Promise(resolve => {
                img.onload = () => resolve({w: img.width, h: img.height});
                img.onerror = () => resolve(null);
            });
            const info = await promise;
            const sizeText = info ? `${info.w}x${info.h}` : "Hata";
            const color = (info && info.w > 500) ? "red" : "#1db954";
            html += `<div class="inspect-card"><img src="${item.url}" width="40"><b>${item.name}</b> <span style="color:${color}">${sizeText}</span></div>`;
            resDiv.innerHTML = html;
        }
    }

    function toggleDelBtn() {
        const any = document.querySelector('.select-check:checked');
        document.getElementById('delBtn').style.display = any ? 'block' : 'none';
        document.getElementById('delBtn').style.background = any ? 'red' : 'gray';
    }

    function sortLogos() {
        const val = document.getElementById('sortSelect').value;
        if(val === 'az') manifestData.sort((a,b) => a.name.localeCompare(b.name));
        if(val === 'za') manifestData.sort((a,b) => b.name.localeCompare(a.name));
        renderGrid(manifestData);
    }

    function showTab(id, btn) {
        document.querySelectorAll('.main-content > div').forEach(d => d.style.display = 'none');
        document.getElementById(id).style.display = 'block';
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }
    function showLoader(t) { document.getElementById('loader').style.display='flex'; document.getElementById('loaderText').innerText=t; }
    function hideLoader() { document.getElementById('loader').style.display='none'; }
    function logout() { localStorage.clear(); location.reload(); }
    window.onload = () => { if(localStorage.getItem('gh_token')) unlock(); };
</script>
</body>
</html>
