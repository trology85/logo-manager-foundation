<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>LOGO MANAGER PRO - V9.1 STABLE</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root { --main-accent: #ff0000; --bg-dark: #0a0a0a; --card-bg: #161616; --text-color: #ffffff; --sidebar-bg: #000000; --border-color: #222222; --input-bg: #1a1a1a; --overlay-bg: rgba(0,0,0,0.95); }
        body.light-mode { --bg-dark: #f0f2f5; --card-bg: #ffffff; --text-color: #1a1a1a; --sidebar-bg: #ffffff; --border-color: #dddfe2; --input-bg: #f5f6f7; --overlay-bg: rgba(255,255,255,0.95); }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-dark); color: var(--text-color); margin: 0; overflow: hidden; transition: 0.3s; }

        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .lock-box { background: #111; padding: 50px; border-radius: 30px; border-top: 5px solid var(--main-accent); text-align: center; width: 380px; }
        .token-input { width: 100%; padding: 15px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 12px; margin-bottom: 20px; text-align: center; outline: none; }

        #mainPanel { display: flex; height: 100vh; opacity: 0; transition: 1s; }
        .sidebar { width: 280px; background: var(--sidebar-bg); padding: 25px; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .main-content { flex: 1; overflow-y: auto; padding: 40px; background: var(--bg-dark); }
        
        .nav-btn { background: none; border: none; color: #777; padding: 16px; text-align: left; cursor: pointer; border-radius: 12px; margin-bottom: 8px; width: 100%; font-weight: 600; transition: 0.3s; }
        .nav-btn.active { background: var(--main-accent); color: white !important; }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 25px; margin-top: 20px; }
        .logo-card { background: var(--card-bg); padding: 20px; border-radius: 18px; text-align: center; border: 1px solid var(--border-color); position: relative; transition: 0.3s; }
        .logo-card:hover { border-color: var(--main-accent); transform: translateY(-8px); }
        .logo-card img { width: 100px; height: 100px; object-fit: contain; background: #000; padding: 8px; border-radius: 12px; margin-bottom: 12px; }
        .select-check { position: absolute; top: 12px; left: 12px; accent-color: var(--main-accent); width: 20px; height: 20px; cursor: pointer; }

        .controls { display: flex; gap: 15px; align-items: center; margin-bottom: 30px; }
        select, input[type="text"] { padding: 12px 18px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-color); outline: none; }

        .btn-action { background: var(--main-accent); color: white; border: none; padding: 14px; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-green { background: #1db954; color: white; border: none; padding: 15px; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; }

        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--overlay-bg); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 10001; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--main-accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loader"><div class="spinner"></div><p id="loaderText" style="margin-top:15px;">İşlem Yapılıyor...</p></div>

    <div id="customPopup" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:20000; display:none; justify-content:center; align-items:center; backdrop-filter:blur(5px);">
        <div style="background:var(--card-bg); padding:30px; border-radius:20px; text-align:center; width:340px; border:1px solid var(--main-accent);">
            <h3 id="popupTitle">MESAJ</h3>
            <p id="popupText" style="color:#888;"></p>
            <div style="display:flex; gap:10px; margin-top:25px;">
                <button id="btnPopupNo" class="btn-action" style="background:#444;">VAZGEÇ</button>
                <button id="btnPopupYes" class="btn-action">TAMAM</button>
            </div>
        </div>
    </div>

    <div id="loginOverlay">
        <div class="lock-box">
            <h2 style="color:var(--main-accent);">LOGO MANAGER</h2>
            <p style="color:#555; font-size:12px; margin-bottom:30px;">V9.1 STABLE ENGINE</p>
            <input type="password" id="entryToken" class="token-input" placeholder="GitHub Token Girin">
            <button class="btn-action" onclick="unlock()">SİSTEMİ AÇ</button>
        </div>
    </div>

    <div id="mainPanel">
        <div class="sidebar">
            <h2 style="color:var(--main-accent); text-align:center; margin-bottom:40px; font-weight:900;">LOGO PRO</h2>
            <button class="nav-btn active" onclick="showTab('tab-upload', this)">📤 Çoklu Yükle</button>
            <button class="nav-btn" onclick="showTab('tab-library', this)">📂 Tüm Arşiv (JSON)</button>
            <button class="nav-btn" onclick="showTab('tab-settings', this)">⚙️ Ayarlar</button>
            <div style="margin-top: auto; border-top: 1px solid var(--border-color); padding-top: 25px;">
                <button id="publishBtn" class="btn-green" onclick="publishSystem()">DEĞİŞİKLİKLERİ KAYDET</button>
                <p onclick="logout()" style="text-align:center; color:#555; cursor:pointer; font-size:11px; margin-top:15px;">Güvenli Çıkış</p>
            </div>
        </div>

        <div class="main-content">
            <div id="tab-upload">
                <h1>📤 Yeni Logo Ekle</h1>
                <div style="border: 2px dashed var(--border-color); padding: 120px; text-align:center; border-radius:30px; cursor:pointer; background:rgba(255,255,255,0.02);" onclick="document.getElementById('fileInput').click()">
                    <h2 id="statusText" style="color:#555;">Dosyaları Buraya Bırakın</h2>
                    <input type="file" id="fileInput" multiple accept="image/*" style="display:none" onchange="handleUpload(this.files)">
                </div>
            </div>

            <div id="tab-library" style="display:none;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h1>📂 Arşiv <span id="syncStatus" style="font-size:13px; color:var(--main-accent);"></span></h1>
                    <div id="deleteTool" style="display:none; gap:15px; background:var(--main-accent); padding:10px 20px; border-radius:12px;">
                        <span id="selCount" style="font-weight:bold; color:white;">0 seçildi</span>
                        <button onclick="deleteFromManifest()" style="background:white; color:var(--main-accent); border:none; padding:8px 15px; border-radius:8px; font-weight:bold; cursor:pointer;">LİSTEDEN SİL</button>
                    </div>
                </div>

                <div class="controls">
                    <input type="text" id="searchInput" placeholder="İsimle ara..." onkeyup="filterAndSort()" style="flex:1;">
                    <select id="sortOrder" onchange="filterAndSort()">
                        <option value="newest">En Yeni (Son Eklenen)</option>
                        <option value="oldest">En Eski (İlk Eklenen)</option>
                        <option value="name_asc">İsim (A-Z)</option>
                        <option value="name_desc">İsim (Z-A)</option>
                    </select>
                </div>
                <div id="githubGrid" class="grid-container"></div>
            </div>

            <div id="tab-settings" style="display:none;">
                <h1>⚙️ Ayarlar</h1>
                <button class="btn-action" onclick="toggleTheme()" id="themeBtn" style="margin-bottom:30px; width:250px;">AÇIK TEMAYA GEÇ</button>
                <h3>Panel Vurgu Rengi</h3>
                <div id="colorGrid" class="grid-container" style="grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));"></div>
            </div>
        </div>
    </div>

<script>
    const GITHUB_USER = "trology85";
    const GITHUB_REPO = "logo-manager-foundation";
    const firebaseConfig = { apiKey: "AIzaSyDMgOE-RvyqOpNGLM9w6kWzofsCCB8BB54", authDomain: "logo-server-fixed.firebaseapp.com", projectId: "logo-server-fixed", storageBucket: "logo-server-fixed.firebasestorage.app", messagingSenderId: "822558792997", appId: "1:822558792997:web:b83cb53311bb68bbb68ecc" };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let manifestData = []; 

    async function unlock() {
        const t = document.getElementById('entryToken').value;
        if(t.startsWith("ghp_")) {
            localStorage.setItem('gh_token', t);
            document.getElementById('loginOverlay').style.display = "none";
            document.getElementById('mainPanel').style.opacity = "1";
            await loadManifest();
        } else { alert("Geçersiz Token!"); }
    }

    async function loadManifest() {
        showLoader("Arşiv Okunuyor...");
        const token = localStorage.getItem('gh_token');
        try {
            const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/logolar.json`, {
                headers: { "Authorization": `token ${token}` }
            });
            if(res.ok) {
                const file = await res.json();
                manifestData = JSON.parse(decodeURIComponent(escape(atob(file.content))));
            }
            filterAndSort();
            document.getElementById('syncStatus').innerText = `(${manifestData.length} Logo)`;
        } catch (e) { console.error(e); }
        finally { hideLoader(); }
    }

    // --- SIRALAMA VE FİLTRE MOTORU ---
    function filterAndSort() {
        const search = document.getElementById('searchInput').value.toUpperCase();
        const sort = document.getElementById('sortOrder').value;
        
        // 1. Arama Filtresi
        let filtered = manifestData.map((f, i) => ({...f, originalIndex: i}))
                                  .filter(f => f.name.includes(search));

        // 2. Sıralama Mantığı
        if (sort === "name_asc") filtered.sort((a,b) => a.name.localeCompare(b.name));
        else if (sort === "name_desc") filtered.sort((a,b) => b.name.localeCompare(a.name));
        else if (sort === "newest") filtered.reverse(); // Listeye son eklenen en sonda olduğu için reverse
        else if (sort === "oldest") { /* default manifest sırası zaten oldest */ }

        renderGrid(filtered);
    }

    function renderGrid(data) {
        const grid = document.getElementById('githubGrid');
        grid.innerHTML = data.map(f => `
            <div class="logo-card">
                <input type="checkbox" class="select-check" value="${f.originalIndex}" onchange="updateSelection()">
                <img src="${f.url}" onerror="this.src='https://via.placeholder.com/100?text=YOK'">
                <p style="font-size:11px; margin:0; overflow:hidden; white-space:nowrap;">${f.name}</p>
            </div>
        `).join('');
    }

    async function handleUpload(files) {
        showLoader("Logolar Yükleniyor...");
        const token = localStorage.getItem('gh_token');
        for (let file of files) {
            const reader = new FileReader();
            await new Promise(resolve => {
                reader.readAsDataURL(file);
                reader.onload = async () => {
                    const content = reader.result.split(',')[1];
                    const cleanName = file.name.split('.')[0].toUpperCase();
                    await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/logos/${file.name}`, {
                        method: "PUT", headers: { "Authorization": `token ${token}` },
                        body: JSON.stringify({ message: "Upload", content: content })
                    });
                    if(!manifestData.find(m => m.name === cleanName)) {
                        manifestData.push({ name: cleanName, url: `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/logos/${file.name}`, rev: "rev=1" });
                    }
                    resolve();
                };
            });
        }
        //await saveManifestAndFirebase();
        hideLoader();
    }

    async function saveManifestAndFirebase() {
        const token = localStorage.getItem('gh_token');
        showLoader("Mühürleniyor...");
        try {
            const content = btoa(unescape(encodeURIComponent(JSON.stringify(manifestData, null, 2))));
            const getFile = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/logolar.json`, { headers: { "Authorization": `token ${token}` } });
            let sha = ""; if(getFile.ok) { const f = await getFile.json(); sha = f.sha; }
            await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/logolar.json`, {
                method: "PUT", headers: { "Authorization": `token ${token}` },
                body: JSON.stringify({ message: "Sync", content: content, sha: sha })
            });
            const snap = await db.collection("logoListesi").get();
            const batch = db.batch();
            snap.forEach(d => batch.delete(d.ref));
            manifestData.forEach(item => batch.set(db.collection("logoListesi").doc(), { ...item, tarih: firebase.firestore.FieldValue.serverTimestamp() }));
            await batch.commit();
            filterAndSort();
        } catch (e) { console.error(e); }
    }

    async function deleteFromManifest() {
        if(!await confirm("Fihristten silinsin mi?")) return;
        const indices = Array.from(document.querySelectorAll('.select-check:checked')).map(c => parseInt(c.value)).sort((a,b) => b-a);
        indices.forEach(i => manifestData.splice(i, 1));
        await saveManifestAndFirebase();
        updateSelection();
        hideLoader();
    }

    function updateSelection() {
        const sel = document.querySelectorAll('.select-check:checked');
        document.getElementById('deleteTool').style.display = sel.length ? 'flex' : 'none';
        document.getElementById('selCount').innerText = sel.length + " seçildi";
    }

    function showTab(id, btn) {
        document.querySelectorAll('.main-content > div').forEach(d => d.style.display = 'none');
        document.getElementById(id).style.display = 'block';
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function toggleTheme() {
        const isLight = document.body.classList.toggle('light-mode');
        localStorage.setItem('theme_mode', isLight ? 'light' : 'dark');
        document.getElementById('themeBtn').innerText = isLight ? "KOYU TEMAYA GEÇ" : "AÇIK TEMAYA GEÇ";
    }

    function logout() { localStorage.removeItem('gh_token'); location.reload(); }

    window.onload = () => {
        const colors = [{name:"Vişne",code:"#ff0000"},{name:"Mavi",code:"#00d4ff"},{name:"Neon",code:"#00f3ff"},{name:"Altın",code:"#ffbf00"},{name:"Bakır",code:"#cd7f32"},{name:"Lacivert",code:"#000080"},{name:"Mor",code:"#8f00ff"},{name:"Nane",code:"#98ff98"},{name:"Petrol",code:"#005f56"},{name:"Platin",code:"#e5e4e2"}];
        const cGrid = document.getElementById('colorGrid');
        colors.forEach(c => {
            const b = document.createElement('div'); b.className = 'logo-card';
            b.style.cssText = `background:${c.code}; height:45px; cursor:pointer; color:white; font-size:10px; font-weight:bold; display:flex; align-items:center; justify-content:center;`;
            b.innerText = c.name; b.onclick = () => { document.documentElement.style.setProperty('--main-accent', c.code); localStorage.setItem('theme_accent', c.code); };
            cGrid.appendChild(b);
        });
        document.documentElement.style.setProperty('--main-accent', localStorage.getItem('theme_accent') || '#ff0000');
        if(localStorage.getItem('theme_mode') === 'light') toggleTheme();
        if(localStorage.getItem('gh_token')) { document.getElementById('entryToken').value = localStorage.getItem('gh_token'); unlock(); }
    };

    function showLoader(txt) { document.getElementById('loader').style.display='flex'; document.getElementById('loaderText').innerText=txt; }
    function hideLoader() { document.getElementById('loader').style.display='none'; }
    
    const popup = {
        show: function(t, txt, conf = false) {
            document.getElementById('popupTitle').innerText = t; document.getElementById('popupText').innerText = txt;
            document.getElementById('btnPopupNo').style.display = conf ? 'block' : 'none';
            document.getElementById('customPopup').style.display = 'flex';
            return new Promise(res => {
                document.getElementById('btnPopupYes').onclick = () => { document.getElementById('customPopup').style.display='none'; res(true); };
                document.getElementById('btnPopupNo').onclick = () => { document.getElementById('customPopup').style.display='none'; res(false); };
            });
        }
    };
    window.alert = (m) => popup.show("BİLGİ", m);
    window.confirm = (m) => popup.show("ONAY", m, true);
</script>
</body>
</html>
