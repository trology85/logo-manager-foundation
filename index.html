<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>LOGO MANAGER PRO v4 - ELITE</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root { --main-red: #ff0000; --bg-dark: #0f0f0f; --card-bg: #1a1a1a; --sidebar-bg: #000; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-dark); color: white; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: var(--sidebar-bg); padding: 20px; display: flex; flex-direction: column; border-right: 1px solid #333; }
        .sidebar h2 { color: var(--main-red); font-size: 20px; text-align: center; margin-bottom: 30px; letter-spacing: 2px; border-bottom: 2px solid var(--main-red); padding-bottom: 10px; }
        .nav-btn { background: none; border: none; color: #888; padding: 15px; text-align: left; cursor: pointer; font-size: 15px; border-radius: 10px; transition: 0.3s; margin-bottom: 5px; }
        .nav-btn:hover, .nav-btn.active { background: #222; color: white; border-left: 5px solid var(--main-red); }

        /* Main Area */
        .main-content { flex: 1; overflow-y: auto; padding: 30px; position: relative; }
        .tab-content { display: none; animation: fadeIn 0.4s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Controls Bar */
        .controls-bar { display: flex; gap: 15px; align-items: center; margin-bottom: 25px; background: #1a1a1a; padding: 15px; border-radius: 12px; }
        .search-box { flex: 1; padding: 12px; background: #252525; border: 1px solid #333; border-radius: 8px; color: white; outline: none; }
        .sort-select { padding: 11px; background: #252525; border: 1px solid #333; color: white; border-radius: 8px; cursor: pointer; }

        /* Multi-Delete Bar */
        #multiDeleteBar { display: none; position: sticky; top: 0; z-index: 100; background: #ff0000; color: white; padding: 12px; border-radius: 8px; margin-bottom: 15px; justify-content: space-between; align-items: center; font-weight: bold; }

        /* Grid & Cards */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        .logo-card { background: var(--card-bg); padding: 15px; border-radius: 15px; text-align: center; position: relative; border: 1px solid #222; transition: 0.3s; }
        .logo-card:hover { border-color: var(--main-red); transform: scale(1.03); }
        .logo-card img { width: 90px; height: 90px; object-fit: contain; margin-bottom: 10px; border-radius: 10px; background: #222; padding: 5px; }
        .logo-card p { font-size: 13px; font-weight: 500; margin: 8px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* Checkbox */
        .select-check { position: absolute; top: 10px; left: 10px; width: 18px; height: 18px; cursor: pointer; }

        /* Upload Zone */
        .upload-zone { border: 3px dashed #333; padding: 60px; text-align: center; border-radius: 20px; transition: 0.3s; background: #111; }
        .upload-zone:hover { border-color: var(--main-red); background: #161616; }

        .btn-green { background: #28a745; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-red { background: white; color: red; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>LOGO PRO V4</h2>
    <button class="nav-btn active" onclick="showTab('tab-upload', this)">📤 Çoklu Yükle</button>
    <button class="nav-btn" onclick="showTab('tab-library', this)">📂 Logo Kütüphanesi</button>
    <button class="nav-btn" onclick="showTab('tab-settings', this)">⚙️ Güvenlik (Token)</button>
    
    <div style="margin-top: auto; padding-top: 20px;">
        <button id="publishBtn" class="btn-green" style="width: 100%;" onclick="publishJson()">SİSTEMİ YAYINLA</button>
    </div>
</div>

<div class="main-content">
    
    <div id="multiDeleteBar">
        <span id="selectedCount">0 adet seçildi</span>
        <button class="btn-red" onclick="deleteSelected()">SEÇİLENLERİ SİSTEMDEN SİL</button>
    </div>

    <div id="tab-upload" class="tab-content active">
        <h1>Yeni Logolar Ekle</h1>
        <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
            <h2 id="statusText" style="color: #666;">Resimleri buraya sürükle veya seç</h2>
            <p>Aynı anda birden fazla dosya yükleyebilirsin</p>
            <input type="file" id="fileInput" multiple accept="image/*" style="display:none" onchange="handleMultipleUpload(this.files)">
        </div>
    </div>

    <div id="tab-library" class="tab-content">
        <h1>Logo Kütüphanesi</h1>
        <div class="controls-bar">
            <input type="text" id="searchInput" class="search-box" placeholder="Kanal ismine göre ara..." onkeyup="loadData()">
            <select id="sortSelect" class="sort-select" onchange="loadData()">
                <option value="name_asc">A'dan Z'ye</option>
                <option value="name_desc">Z'den A'ya</option>
                <option value="date_desc">En Yeni Eklenen</option>
                <option value="date_asc">En Eski Eklenen</option>
            </select>
            <button class="nav-btn" onclick="toggleSelectAll()">Hepsini Seç</button>
        </div>
        <div id="gridContainer" class="grid-container"></div>
    </div>

    <div id="tab-settings" class="tab-content">
        <h1>Güvenlik ve Token</h1>
        <p>GitHub Token'ınız tarayıcı hafızasında şifreli gibi saklanır.</p>
        <input type="password" id="tokenInput" class="search-box" style="width: 100%;" placeholder="ghp_... Token'ınızı buraya yapıştırın">
        <br><br>
        <button class="btn-green" onclick="saveToken()">TOKEN'I GÜNCELLE</button>
    </div>
</div>

<script>
    // FIREBASE CONFIG
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "logo-server-fixed.firebaseapp.com",
        projectId: "logo-server-fixed",
        storageBucket: "logo-server-fixed.firebasestorage.app",
        messagingSenderId: "822558792997",
        appId: "1:822558792997:web:b83cb53311bb68bbb68ecc"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const GITHUB_USER = "trology85";
    const GITHUB_REPO = "logo-manager-foundation";

    let selectedIds = [];

    function showTab(id, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
        if(id === 'tab-library') loadData();
    }

    function saveToken() {
        localStorage.setItem('gh_token', document.getElementById('tokenInput').value);
        alert("Token Kaydedildi!");
    }

    function getToken() { return localStorage.getItem('gh_token'); }

    // ÇOKLU YÜKLEME
    async function handleMultipleUpload(files) {
        const token = getToken();
        if(!token) return alert("Önce Token girmelisiniz!");
        
        const status = document.getElementById('statusText');
        let count = 0;

        for (let file of files) {
            count++;
            status.innerText = `Yükleniyor: ${count}/${files.length} - ${file.name}`;
            const reader = new FileReader();
            
            await new Promise(resolve => {
                reader.readAsDataURL(file);
                reader.onload = async () => {
                    const content = reader.result.split(',')[1];
                    const path = "logos/" + file.name;

                    const gh = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`, {
                        method: "PUT",
                        headers: { "Authorization": `token ${token}` },
                        body: JSON.stringify({ message: "Upload: " + file.name, content: content })
                    });

                    if(gh.ok) {
                        await db.collection("logoListesi").add({
                            name: file.name.split('.')[0].toUpperCase(),
                            url: `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${path}`,
                            tarih: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }
                    resolve();
                };
            });
        }
        status.innerText = "BAŞARIYLA TAMAMLANDI!";
        setTimeout(() => location.reload(), 1500);
    }

    // VERİLERİ YÜKLE (SIRALAMA VE ARAMA)
    function loadData() {
        const searchTerm = document.getElementById('searchInput').value.toUpperCase();
        const sortBy = document.getElementById('sortSelect').value;
        
        let query = db.collection("logoListesi");

        // Sıralama Mantığı
        if(sortBy === "name_asc") query = query.orderBy("name", "asc");
        else if(sortBy === "name_desc") query = query.orderBy("name", "desc");
        else if(sortBy === "date_desc") query = query.orderBy("tarih", "desc");
        else if(sortBy === "date_asc") query = query.orderBy("tarih", "asc");

        query.onSnapshot(snapshot => {
            const container = document.getElementById('gridContainer');
            container.innerHTML = "";
            
            snapshot.forEach(doc => {
                const d = doc.data();
                if(d.name.includes(searchTerm)) {
                    container.innerHTML += `
                        <div class="logo-card">
                            <input type="checkbox" class="select-check" value="${doc.id}" onchange="updateSelection()">
                            <img src="${d.url}">
                            <p>${d.name}</p>
                        </div>`;
                }
            });
        });
    }

    // SEÇİM YÖNETİMİ
    function updateSelection() {
        selectedIds = Array.from(document.querySelectorAll('.select-check:checked')).map(cb => cb.value);
        const bar = document.getElementById('multiDeleteBar');
        if(selectedIds.length > 0) {
            bar.style.display = 'flex';
            document.getElementById('selectedCount').innerText = `${selectedIds.length} kanal seçildi`;
        } else {
            bar.style.display = 'none';
        }
    }

    function toggleSelectAll() {
        const checks = document.querySelectorAll('.select-check');
        const firstValue = checks[0].checked;
        checks.forEach(c => c.checked = !firstValue);
        updateSelection();
    }

    async function deleteSelected() {
        if(!confirm(`${selectedIds.length} adet logo silinecek. Emin misin?`)) return;
        
        for(let id of selectedIds) {
            await db.collection("logoListesi").doc(id).delete();
        }
        alert("Seçilenler silindi!");
        updateSelection();
    }

    // JSON YAYINLAMA
    async function publishJson() {
        const token = getToken();
        if(!token) return alert("Token Yok!");
        const btn = document.getElementById('publishBtn');
        btn.innerText = "YAYINLANIYOR...";
        
        const snapshot = await db.collection("logoListesi").orderBy("name", "asc").get();
        let list = [];
        snapshot.forEach(doc => {
            const d = doc.data();
            list.push({ name: d.name, url: d.url, rev: "rev=1" });
        });

        const content = btoa(unescape(encodeURIComponent(JSON.stringify(list, null, 2))));
        const path = "logos.json";

        const getFile = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`, {
            headers: { "Authorization": `token ${token}` }
        });
        let sha = "";
        if(getFile.ok) { const f = await getFile.json(); sha = f.sha; }

        const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`, {
            method: "PUT",
            headers: { "Authorization": `token ${token}` },
            body: JSON.stringify({ message: "Full Update", content: content, sha: sha })
        });

        if(res.ok) alert("GitHub JSON başarıyla güncellendi!");
        else alert("Hata oluştu!");
        btn.innerText = "SİSTEMİ YAYINLA";
    }
</script>

</body>
</html>
