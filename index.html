<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>LOGO MANAGER PRO - V10 ULTIMATE</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/trology85/logo-manager-foundation/main/panel-logo.png">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root { --main-accent: #ff0000; --bg-dark: #0a0a0a; --card-bg: #161616; --text-color: #ffffff; --sidebar-bg: #000000; --border-color: #222222; --input-bg: #1a1a1a; --overlay-bg: rgba(0,0,0,0.95); }
        body.light-mode { --bg-dark: #f0f2f5; --card-bg: #ffffff; --text-color: #1a1a1a; --sidebar-bg: #ffffff; --border-color: #dddfe2; --input-bg: #f5f6f7; --overlay-bg: rgba(255,255,255,0.95); }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-dark); color: var(--text-color); margin: 0; overflow: hidden; transition: 0.3s; }

        /* --- LOGO VE EFEKTLER --- */
        .neon-logo { width: 140px; height: auto; filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.4)); animation: neonPulse 3s infinite ease-in-out; }
        @keyframes neonPulse { 0%, 100% { filter: drop-shadow(0 0 12px rgba(255, 0, 0, 0.4)); transform: scale(1); } 50% { filter: drop-shadow(0 0 25px rgba(255, 0, 0, 0.8)); transform: scale(1.03); } }

        /* --- GİRİŞ EKRANI --- */
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .lock-box { background: #111; padding: 50px; border-radius: 35px; border-top: 5px solid var(--main-accent); text-align: center; width: 380px; }
        .token-input { width: 100%; padding: 15px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 12px; margin-bottom: 20px; text-align: center; }

        /* --- ANA PANEL VE SIDEBAR --- */
        #mainPanel { display: flex; height: 100vh; opacity: 0; transition: 1s; }
        .sidebar { width: 280px; background: var(--sidebar-bg); padding: 25px; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .main-content { flex: 1; overflow-y: auto; padding: 40px; background: var(--bg-dark); }
        .nav-btn { background: none; border: none; color: #777; padding: 16px; text-align: left; cursor: pointer; border-radius: 12px; margin-bottom: 8px; font-weight: 600; }
        .nav-btn.active { background: var(--main-accent); color: white !important; }

        /* --- ARŞİV GRID VE SIRALAMA --- */
        .grid-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        .logo-card { background: var(--card-bg); padding: 15px; border-radius: 15px; text-align: center; border: 1px solid var(--border-color); position: relative; }
        .logo-card img { width: 80px; height: 80px; object-fit: contain; margin-bottom: 10px; }
        .select-check { position: absolute; top: 10px; left: 10px; accent-color: var(--main-accent); }

        /* --- MÜFETTİŞ (KARŞILAŞTIRMA) --- */
        .inspect-card { background: var(--card-bg); border-radius: 15px; padding: 15px; display: flex; align-items: center; gap: 20px; margin-bottom: 10px; border-left: 5px solid var(--main-accent); }
        .inspect-card img { width: 50px; height: 50px; object-fit: contain; }

        /* --- BUTONLAR --- */
        .btn-action { background: var(--main-accent); color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .btn-green { background: #1db954; color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--overlay-bg); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 10001; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--main-accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="">

    <div id="loader"><div class="spinner"></div><p id="loaderText" style="margin-top:15px;">İşlem Yapılıyor...</p></div>

    <div id="mainPanel">
        <div class="sidebar">
            <img src="https://raw.githubusercontent.com/trology85/logo-manager-foundation/main/panel-logo.png" style="width:80px; margin:0 auto 20px auto;">
            <button class="nav-btn active" onclick="showTab('tab-upload', this)">📤 Çoklu Yükle</button>
            <button class="nav-btn" onclick="showTab('tab-library', this)">📂 Tüm Arşiv</button>
            <button class="nav-btn" onclick="showTab('tab-detective', this)">🔍 M3U Dedektifi</button>
            <button class="nav-btn" onclick="showTab('tab-licenses', this)">🔐 Lisans Merkezi</button>
            <button class="nav-btn" onclick="showTab('tab-inspector', this)">📏 Logo Müfettişi</button>
            <button class="nav-btn" onclick="showTab('tab-settings', this)">⚙️ Ayarlar</button>
            
            <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border-color);">
                <button class="btn-green" style="width:100%" onclick="saveManifestAndFirebase()">DEĞİŞİKLİKLERİ KAYDET</button>
                <p onclick="logout()" style="text-align:center; color:#555; cursor:pointer; font-size:11px; margin-top:10px;">Güvenli Çıkış</p>
            </div>
        </div>

        <div class="main-content">
            <div id="tab-upload">
                <h1>📤 Yeni Logo Ekle</h1>
                <div style="border: 2px dashed var(--border-color); padding: 80px; text-align:center; border-radius:20px; cursor:pointer;" onclick="document.getElementById('fileInput').click()">
                    <h2 style="color:#555;">Dosyaları Sürükle veya Seç</h2>
                    <input type="file" id="fileInput" multiple accept="image/*" style="display:none" onchange="handleUpload(this.files)">
                </div>
            </div>

            <div id="tab-library" style="display:none;">
                <div class="grid-header">
                    <h1>📂 Arşiv <small id="syncStatus"></small></h1>
                    <div style="display:flex; gap:10px;">
                        <select id="sortSelect" onchange="sortLogos()" style="background:var(--input-bg); color:white; border:1px solid var(--border-color); padding:8px; border-radius:8px;">
                            <option value="new">En Yeni</option>
                            <option value="old">En Eski</option>
                            <option value="az">A'dan Z'ye</option>
                            <option value="za">Z'den A'ya</option>
                        </select>
                        <div id="deleteTool" style="display:none; align-items:center; gap:10px; background:var(--main-accent); padding:5px 15px; border-radius:10px;">
                            <span id="selCount">0 seçildi</span>
                            <button onclick="deleteSelected()" style="background:white; color:red; border:none; padding:5px 10px; border-radius:5px; font-weight:bold; cursor:pointer;">SİL</button>
                        </div>
                    </div>
                </div>
                <div id="githubGrid" class="grid-container"></div>
            </div>

            <div id="tab-detective" style="display:none;">
                <h1>🔍 M3U Dedektifi</h1>
                <div style="background:var(--card-bg); padding:30px; border-radius:20px; border:1px solid var(--border-color);">
                    <input type="file" id="m3uInput" accept=".m3u" style="width:100%; margin-bottom:15px; color:white;">
                    <button class="btn-action" style="width:100%" onclick="processM3U()">KORUMALI LİSTE ÜRET</button>
                </div>
                <div id="detectiveResult" style="display:none; margin-top:20px;">
                    <button id="downloadM3U" class="btn-green" style="width:100%">MÜHÜRLÜ M3U İNDİR</button>
                </div>
            </div>

            <div id="tab-licenses" style="display:none;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h1>🔐 Lisans Yönetimi</h1>
                    <button class="btn-green" onclick="createNewLicense()">+ YENİ LİSANS</button>
                </div>
                <table style="width:100%; margin-top:20px; border-collapse: collapse;">
                    <thead><tr style="text-align:left; color:var(--main-accent);"><th>MÜŞTERİ</th><th>KEY</th><th>IP</th><th>DURUM</th><th>İŞLEM</th></tr></thead>
                    <tbody id="licenseList"></tbody>
                </table>
            </div>

            <div id="tab-inspector" style="display:none;">
                <h1>📏 Logo Müfettişi</h1>
                <p style="color:#888;">Arşivdeki tüm logoların çözünürlüklerini ve durumlarını denetleyin.</p>
                <button class="btn-action" onclick="inspectArchive()">TARAMAYI BAŞLAT</button>
                <div id="inspectorResult" style="margin-top:20px;"></div>
            </div>

            <div id="tab-settings" style="display:none;">
                <h1>⚙️ Ayarlar</h1>
                <div style="background:var(--card-bg); padding:20px; border-radius:15px;">
                    <h3>Tema Seçimi</h3>
                    <div style="display:flex; gap:10px;">
                        <button class="btn-action" onclick="setTheme('dark')" style="background:#111;">Karanlık Mod</button>
                        <button class="btn-action" onclick="setTheme('light')" style="background:#eee; color:#000;">Aydınlık Mod</button>
                        <button class="btn-action" onclick="setTheme('neon')" style="background:linear-gradient(45deg, #ff0000, #000);">Neon Mod</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="loginOverlay">
        <div class="lock-box">
            <img src="https://raw.githubusercontent.com/trology85/logo-manager-foundation/main/panel-logo.png" class="neon-logo">
            <h2 style="color:var(--main-accent); margin:10px 0;">LOGO MANAGER PRO</h2>
            <input type="password" id="entryToken" class="token-input" placeholder="GitHub Token Girin">
            <button class="btn-action" style="width:100%" onclick="unlock()">SİSTEMİ AÇ</button>
        </div>
    </div>

<script>
    const GITHUB_USER = "trology85";
    const GITHUB_REPO = "logo-manager-foundation";
    const firebaseConfig = { apiKey: "AIzaSyDMgOE-RvyqOpNGLM9w6kWzofsCCB8BB54", authDomain: "logo-server-fixed.firebaseapp.com", projectId: "logo-server-fixed", storageBucket: "logo-server-fixed.firebasestorage.app", messagingSenderId: "822558792997", appId: "1:822558792997:web:b83cb53311bb68bbb68ecc" };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let manifestData = [];

    // --- SİSTEM GİRİŞ ---
    async function unlock() {
        const t = document.getElementById('entryToken').value;
        if(t.length > 20) {
            localStorage.setItem('gh_token', t);
            document.getElementById('loginOverlay').style.display = "none";
            document.getElementById('mainPanel').style.opacity = "1";
            await loadManifest();
            await loadLicenses();
        } else { alert("Geçersiz Token!"); }
    }

    // --- ARŞİV YÜKLEME VE SIRALAMA ---
    async function loadManifest() {
        showLoader("Arşiv Okunuyor...");
        const token = localStorage.getItem('gh_token');
        try {
            const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/logolar.json`, {
                headers: { "Authorization": `token ${token}` }
            });
            if(res.ok) {
                const file = await res.json();
                manifestData = JSON.parse(decodeURIComponent(escape(atob(file.content))));
                sortLogos(); 
            }
        } catch (e) { console.error(e); }
        finally { hideLoader(); }
    }

    function renderGrid(data) {
        const grid = document.getElementById('githubGrid');
        grid.innerHTML = data.map((f, i) => `
            <div class="logo-card">
                <input type="checkbox" class="select-check" value="${f.name}" onchange="updateSelection()">
                <img src="${f.url}" onerror="this.src='https://via.placeholder.com/80?text=ERR'">
                <p style="font-size:11px; margin:0; overflow:hidden;">${f.name}</p>
            </div>
        `).join('');
        document.getElementById('syncStatus').innerText = `(${data.length} Logo)`;
    }

    function sortLogos() {
        const type = document.getElementById('sortSelect').value;
        let sorted = [...manifestData];
        if(type === 'az') sorted.sort((a,b) => a.name.localeCompare(b.name));
        else if(type === 'za') sorted.sort((a,b) => b.name.localeCompare(a.name));
        else if(type === 'old') sorted = [...manifestData]; // Varsayılan ekleme sırası
        else if(type === 'new') sorted.reverse();
        renderGrid(sorted);
    }

    // --- M3U DEDEKTİFİ (DÜZELTİLMİŞ) ---
    async function processM3U() {
        const lKey = prompt("Müşteri Lisans Anahtarı:");
        if(!lKey) return;
        const fileInput = document.getElementById('m3uInput');
        if (!fileInput.files[0]) return;
        
        showLoader("Mühürleniyor...");
        const content = await fileInput.files[0].text();
        const lines = content.split('\n');
        let result = [`#EXTM3U x-logo-source="https://logo-server-fixed.web.app/logolar.json"`];
        
        const myLogos = manifestData.map(m => m.name.toUpperCase());

        lines.forEach(line => {
            if (line.startsWith('#EXTINF')) {
                const parts = line.split(',');
                const rawName = parts[parts.length - 1].trim().toUpperCase();
                let cleanLine = line.replace(/\s*tvg-logo="[^"]*"/gi, "").replace(/\s*logo-id="[^"]*"/gi, "");

                if (myLogos.includes(rawName)) {
                    const proxy = `https://logo-server-fixed.web.app/logo.html?id=${rawName}&key=${lKey}`;
                    cleanLine = cleanLine.replace('#EXTINF:-1', `#EXTINF:-1 logo-id="${rawName}" tvg-logo="${proxy}"`);
                }
                result.push(cleanLine);
            } else if (line.trim() !== "" && !line.startsWith('#EXTM3U')) {
                result.push(line);
            }
        });

        const blob = new Blob([result.join('\n')], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        document.getElementById('detectiveResult').style.display = 'block';
        document.getElementById('downloadM3U').onclick = () => {
            const a = document.createElement('a');
            a.href = url; a.download = `MUHURLU_${lKey}.m3u`; a.click();
        };
        hideLoader();
    }

    // --- MÜFETTİŞ (KARŞILAŞTIRMA) ---
    async function inspectArchive() {
        const resDiv = document.getElementById('inspectorResult');
        resDiv.innerHTML = "Taranıyor...";
        let html = "";
        for(let logo of manifestData) {
            const img = new Image();
            img.src = logo.url;
            await new Promise(r => img.onload = img.onerror = r);
            const size = img.width ? `${img.width}x${img.height}` : "Hatalı Link";
            const color = img.width > 500 ? "#ff4444" : "#1db954";
            html += `<div class="inspect-card">
                <img src="${logo.url}">
                <div style="flex:1"><b>${logo.name}</b></div>
                <div style="color:${color}; font-weight:bold;">${size}</div>
            </div>`;
        }
        resDiv.innerHTML = html;
    }

    // --- LİSANS İŞLEMLERİ ---
    async function loadLicenses() {
        const snap = await db.collection("lisanslar").get();
        const tbody = document.getElementById('licenseList');
        tbody.innerHTML = "";
        snap.forEach(doc => {
            const d = doc.data();
            tbody.innerHTML += `<tr style="border-bottom:1px solid #222; height:40px;">
                <td>${d.musteriAd}</td>
                <td><code>${d.key}</code></td>
                <td>${d.lockedIP || 'Açık'}</td>
                <td>${d.durum}</td>
                <td><button onclick="db.collection('lisanslar').doc('${doc.id}').delete().then(loadLicenses)">Sil</button></td>
            </tr>`;
        });
    }

    async function createNewLicense() {
        const ad = prompt("Müşteri Adı:");
        if(!ad) return;
        const key = "PRO-" + Math.random().toString(36).substr(2, 8).toUpperCase();
        await db.collection("lisanslar").add({ musteriAd: ad, key: key, durum: "Aktif", lockedIP: "" });
        loadLicenses();
    }

    // --- TEMA VE DİĞER ---
    function setTheme(t) {
        document.body.className = t === 'light' ? 'light-mode' : '';
        if(t === 'neon') document.body.style.background = "radial-gradient(circle, #200, #000)";
        else document.body.style.background = "";
    }

    function showTab(id, btn) {
        document.querySelectorAll('.main-content > div').forEach(d => d.style.display = 'none');
        document.getElementById(id).style.display = 'block';
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function showLoader(txt) { document.getElementById('loader').style.display='flex'; document.getElementById('loaderText').innerText=txt; }
    function hideLoader() { document.getElementById('loader').style.display='none'; }
    function logout() { localStorage.clear(); location.reload(); }

    window.onload = () => { if(localStorage.getItem('gh_token')) { document.getElementById('entryToken').value = localStorage.getItem('gh_token'); unlock(); } };
</script>
</body>
</html>
