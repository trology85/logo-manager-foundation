<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>LOGO MANAGER PRO - V10 ULTIMATE</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/trology85/logo-manager-foundation/main/panel-logo.png">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root { --main-accent: #ff0000; --bg-dark: #0a0a0a; --card-bg: #161616; --text-color: #ffffff; --sidebar-bg: #000000; --border-color: #222222; --input-bg: #1a1a1a; --overlay-bg: rgba(0,0,0,0.95); }
        body.light-mode { --bg-dark: #f0f2f5; --card-bg: #ffffff; --text-color: #1a1a1a; --sidebar-bg: #ffffff; --border-color: #dddfe2; --input-bg: #f5f6f7; --overlay-bg: rgba(255,255,255,0.95); }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-dark); color: var(--text-color); margin: 0; overflow: hidden; transition: 0.3s; }

        /* --- LOGO VE NEON EFEKTLERİ --- */
        .neon-logo { width: 140px; height: auto; margin-bottom: 20px; filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.4)); animation: neonPulse 3s infinite ease-in-out; }
        .sidebar-logo { width: 80px; height: auto; margin: 0 auto 10px auto; display: block; filter: drop-shadow(0 0 5px var(--main-accent)); }
        @keyframes neonPulse { 0%, 100% { filter: drop-shadow(0 0 12px rgba(255, 0, 0, 0.4)); transform: scale(1); } 50% { filter: drop-shadow(0 0 25px rgba(255, 0, 0, 0.8)); transform: scale(1.03); } }

        /* --- GİRİŞ EKRANI --- */
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .lock-box { background: #111; padding: 50px; border-radius: 35px; border-top: 5px solid var(--main-accent); text-align: center; width: 380px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .token-input { width: 100%; padding: 15px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 12px; margin-bottom: 20px; text-align: center; outline: none; box-sizing: border-box; }
        .remember-box { display: flex; align-items: center; justify-content: center; gap: 10px; color: #888; font-size: 13px; margin-bottom: 20px; cursor: pointer; }

        /* --- ANA PANEL VE SIDEBAR --- */
        #mainPanel { display: flex; height: 100vh; opacity: 0; transition: 1s; }
        .sidebar { width: 280px; background: var(--sidebar-bg); padding: 25px; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .main-content { flex: 1; overflow-y: auto; padding: 40px; background: var(--bg-dark); }
        .nav-btn { background: none; border: none; color: #777; padding: 16px; text-align: left; cursor: pointer; border-radius: 12px; margin-bottom: 8px; width: 100%; font-weight: 600; transition: 0.3s; }
        .nav-btn.active { background: var(--main-accent); color: white !important; }

        /* --- KARTLAR VE TABLOLAR --- */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 25px; margin-top: 20px; }
        .logo-card { background: var(--card-bg); padding: 20px; border-radius: 18px; text-align: center; border: 1px solid var(--border-color); position: relative; transition: 0.3s; }
        .logo-card:hover { border-color: var(--main-accent); transform: translateY(-8px); }
        .logo-card img { width: 100px; height: 100px; object-fit: contain; background: #000; padding: 8px; border-radius: 12px; margin-bottom: 12px; }
        .select-check { position: absolute; top: 12px; left: 12px; accent-color: var(--main-accent); width: 20px; height: 20px; cursor: pointer; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: var(--card-bg); border-radius: 15px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 13px; }
        th { background: rgba(255,255,255,0.05); color: var(--main-accent); }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; }
        .badge-active { background: #1db954; color: white; }
        .badge-passive { background: #ff4444; color: white; }

        .btn-action { background: var(--main-accent); color: white; border: none; padding: 14px; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; }
        .btn-green { background: #1db954; color: white; border: none; padding: 15px; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; }

        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--overlay-bg); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 10001; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--main-accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loader"><div class="spinner"></div><p id="loaderText" style="margin-top:15px;">İşlem Yapılıyor...</p></div>

    <div id="customPopup" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:20000; display:none; justify-content:center; align-items:center; backdrop-filter:blur(5px);">
        <div style="background:var(--card-bg); padding:30px; border-radius:20px; text-align:center; width:340px; border:1px solid var(--main-accent);">
            <h3 id="popupTitle">MESAJ</h3>
            <p id="popupText" style="color:#888;"></p>
            <div style="display:flex; gap:10px; margin-top:25px;">
                <button id="btnPopupNo" class="btn-action" style="background:#444;">VAZGEÇ</button>
                <button id="btnPopupYes" class="btn-action">TAMAM</button>
            </div>
        </div>
    </div>

    <div id="loginOverlay">
        <div class="lock-box">
            <img src="https://raw.githubusercontent.com/trology85/logo-manager-foundation/main/panel-logo.png" class="neon-logo">
            <h2 style="color:var(--main-accent); margin:0; font-weight:900;">LOGO MANAGER</h2>
            <p style="color: #555; font-size: 11px; margin-bottom: 25px;">V10 ULTIMATE EDITION</p>
            <input type="password" id="entryToken" class="token-input" placeholder="GitHub Token Girin">
            <label class="remember-box">
                <input type="checkbox" id="rememberMe"> Beni Hatırla
            </label>
            <button class="btn-action" onclick="unlock()">SİSTEMİ AÇ</button>
        </div>
    </div>

    <div id="mainPanel">
        <div class="sidebar">
            <img src="https://raw.githubusercontent.com/trology85/logo-manager-foundation/main/panel-logo.png" class="sidebar-logo">
            <h2 style="color:var(--main-accent); text-align:center; font-size:18px; margin-bottom:20px;">LOGO PRO</h2>
            
            <button class="nav-btn active" onclick="showTab('tab-upload', this)">📤 Çoklu Yükle</button>
            <button class="nav-btn" onclick="showTab('tab-library', this)">📂 Tüm Arşiv</button>
            <button class="nav-btn" onclick="showTab('tab-detective', this)">🔍 M3U Dedektifi</button>
            <button class="nav-btn" onclick="showTab('tab-licenses', this)">🔐 Lisans Merkezi</button>
            <button class="nav-btn" onclick="showTab('tab-inspector', this)">📏 Logo Müfettişi</button>
            <button class="nav-btn" onclick="showTab('tab-settings', this)">⚙️ Ayarlar</button>
            
            <div style="margin-top: auto; border-top: 1px solid var(--border-color); padding-top: 25px;">
                <button id="publishBtn" class="btn-green" onclick="saveManifestAndFirebase()">DEĞİŞİKLİKLERİ KAYDET</button>
                <p onclick="logout()" style="text-align:center; color:#555; cursor:pointer; font-size:11px; margin-top:15px;">Güvenli Çıkış</p>
            </div>
        </div>

        <div class="main-content">
            <div id="tab-licenses" style="display:none;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h1>🔐 Lisans Yönetimi</h1>
                    <button class="btn-green" style="width:200px;" onclick="createNewLicense()">+ YENİ LİSANS ÜRET</button>
                </div>
                <table>
                    <thead>
                        <tr><th>MÜŞTERİ</th><th>TOKEN (ANAHTAR)</th><th>IP KİLİDİ</th><th>DURUM</th><th>İŞLEM</th></tr>
                    </thead>
                    <tbody id="licenseList"></tbody>
                </table>
            </div>

            <div id="tab-upload">
                <h1>📤 Yeni Logo Ekle</h1>
                <div style="border: 2px dashed var(--border-color); padding: 100px; text-align:center; border-radius:30px; cursor:pointer;" onclick="document.getElementById('fileInput').click()">
                    <h2 id="statusText" style="color:#555;">Dosyaları Buraya Bırakın</h2>
                    <input type="file" id="fileInput" multiple accept="image/*" style="display:none" onchange="handleUpload(this.files)">
                </div>
            </div>

            <div id="tab-library" style="display:none;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h1>📂 Arşiv <span id="syncStatus" style="font-size:13px; color:var(--main-accent);"></span></h1>
                    <div id="deleteTool" style="display:none; gap:15px; background:var(--main-accent); padding:10px 20px; border-radius:12px;">
                        <span id="selCount" style="font-weight:bold; color:white;">0 seçildi</span>
                        <button onclick="deleteFromManifest()" style="background:white; color:var(--main-accent); border:none; padding:8px 15px; border-radius:8px; font-weight:bold; cursor:pointer;">SİL</button>
                    </div>
                </div>
                <div id="githubGrid" class="grid-container"></div>
            </div>

            <div id="tab-detective" style="display:none;">
                <h1>🔍 M3U Dedektifi</h1>
                <div style="background:var(--card-bg); padding:30px; border-radius:20px; border:1px solid var(--border-color);">
                    <input type="file" id="m3uInput" accept=".m3u" style="margin-bottom:20px; color:white; width:100%;">
                    <button class="btn-action" onclick="processM3U()">KORUMALI LİSTE ÜRET</button>
                </div>
                <div id="detectiveResult" style="display:none; margin-top:20px;">
                    <button id="downloadM3U" class="btn-green">MÜHÜRLÜ M3U İNDİR</button>
                </div>
            </div>

            <div id="tab-inspector" style="display:none;"><h1>📏 Logo Müfettişi</h1><button class="btn-green" onclick="inspectArchive()">TARAMAYI BAŞLAT</button><div id="inspectorResult"></div></div>
            <div id="tab-settings" style="display:none;"><h1>⚙️ Ayarlar</h1><button class="btn-action" onclick="toggleTheme()" style="width:200px;">TEMA DEĞİŞTİR</button></div>
        </div>
    </div>

<script>
    const GITHUB_USER = "trology85";
    const GITHUB_REPO = "logo-manager-foundation";
    const firebaseConfig = { apiKey: "AIzaSyDMgOE-RvyqOpNGLM9w6kWzofsCCB8BB54", authDomain: "logo-server-fixed.firebaseapp.com", projectId: "logo-server-fixed", storageBucket: "logo-server-fixed.firebasestorage.app", messagingSenderId: "822558792997", appId: "1:822558792997:web:b83cb53311bb68bbb68ecc" };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let manifestData = [];
    let finalM3U = "";

    // --- GİRİŞ & BAŞLANGIÇ ---
    async function unlock() {
        const t = document.getElementById('entryToken').value;
        const remember = document.getElementById('rememberMe').checked;
        if(t.length > 20) {
            if(remember) localStorage.setItem('gh_token', t);
            else sessionStorage.setItem('gh_token', t);
            document.getElementById('loginOverlay').style.display = "none";
            document.getElementById('mainPanel').style.opacity = "1";
            await loadManifest();
            await loadLicenses();
        } else { alert("Geçersiz Token!"); }
    }

    // --- GITHUB İŞLEMLERİ (V9.2'DEN AKTARILDI) ---
    async function loadManifest() {
        showLoader("Arşiv Okunuyor...");
        const token = localStorage.getItem('gh_token') || sessionStorage.getItem('gh_token');
        try {
            const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/logolar.json`, {
                headers: { "Authorization": `token ${token}` }
            });
            if(res.ok) {
                const file = await res.json();
                manifestData = JSON.parse(decodeURIComponent(escape(atob(file.content))));
            }
            renderGrid(manifestData);
            document.getElementById('syncStatus').innerText = `(${manifestData.length} Logo)`;
        } catch (e) { console.error(e); }
        finally { hideLoader(); }
    }

    function renderGrid(data) {
        const grid = document.getElementById('githubGrid');
        grid.innerHTML = data.map((f, i) => `
            <div class="logo-card">
                <input type="checkbox" class="select-check" value="${i}" onchange="updateSelection()">
                <img src="${f.url}" onerror="this.src='https://via.placeholder.com/100?text=YOK'">
                <p style="font-size:11px; margin:0;">${f.name}</p>
            </div>
        `).join('');
    }

    // --- LİSANS YÖNETİMİ (YENİ MOTOR) ---
    async function loadLicenses() {
        const snap = await db.collection("lisanslar").get();
        const tbody = document.getElementById('licenseList');
        tbody.innerHTML = "";
        snap.forEach(doc => {
            const d = doc.data();
            tbody.innerHTML += `<tr>
                <td><b>${d.musteriAd}</b></td>
                <td><code style="color:var(--main-accent)">${d.key}</code></td>
                <td>${d.lockedIP || 'Kilit Yok'}</td>
                <td><span class="badge ${d.durum === 'Aktif' ? 'badge-active' : 'badge-passive'}">${d.durum}</span></td>
                <td>
                    <button onclick="toggleLicense('${doc.id}', '${d.durum}')">Durum</button>
                    <button onclick="resetIP('${doc.id}')">IP Sıfırla</button>
                </td>
            </tr>`;
        });
    }

    async function createNewLicense() {
        const ad = prompt("Müşteri Adı:");
        if(!ad) return;
        const key = "PRO-" + Math.random().toString(36).substr(2, 8).toUpperCase();
        await db.collection("lisanslar").add({ musteriAd: ad, key: key, durum: "Aktif", lockedIP: "" });
        loadLicenses();
    }

    // --- DEDEKTİF (KORUMALI SÜRÜM) ---
    async function processM3U() {
    const lKey = prompt("Müşteri Lisans Anahtarı:");
    if(!lKey) return;
    
    const fileInput = document.getElementById('m3uInput');
    if (!fileInput.files[0]) { alert("Dosya seçilmedi!"); return; }

    showLoader("Mühürleniyor...");
    
    try {
        const file = fileInput.files[0];
        const content = await file.text();
        const lines = content.split('\n');
        let resultLines = [];
        
        // 1. BAŞLIK: Hem JSON kaynağını hem EPG'yi sabitliyoruz
        resultLines.push(`#EXTM3U x-logo-source="https://logo-server-fixed.web.app/logolar.json" x-tvg-url="https://epg-server-auto.web.app/master_epg.xml.gz"`);

        const myLogos = manifestData.map(m => m.name.toUpperCase());

        lines.forEach(line => {
            if (line.toUpperCase().startsWith('#EXTM3U')) return; // Eski başlığı atla

            if (line.toUpperCase().startsWith('#EXTINF')) {
                const parts = line.split(',');
                const rawName = parts[parts.length - 1].trim().toUpperCase();
                
                // Temizlik: Eski etiketleri temizle ki çorba olmasın
                let cleanedLine = line.replace(/\s*tvg-logo="[^"]*"/gi, "")
                                      .replace(/\s*logo-id="[^"]*"/gi, "")
                                      .replace(/\s*key="[^"]*"/gi, "");

                if (myLogos.includes(rawName)) {
                    // BEKÇİ LİNKİ (Eski sistem desteği için)
                    const proxyUrl = `https://logo-server-fixed.web.app/logo.html?id=${rawName}&key=${lKey}`;
                    
                    // HİBRİT YAPI: Hem logo-id (Yeni), hem tvg-logo (Eski), hem key (Lisans)
                    cleanedLine = cleanedLine.replace('#EXTINF:-1', 
                        `#EXTINF:-1 tvg-logo="${proxyUrl}" logo-id="${rawName}" key="${lKey}"`);
                    
                    resultLines.push(cleanedLine);
                } else {
                    resultLines.push(cleanedLine);
                }
            } else if (line.trim() !== "") {
                resultLines.push(line);
            }
        });

        finalM3U = resultLines.join('\n');
        document.getElementById('detectiveResult').style.display = 'block';
        
        document.getElementById('downloadM3U').onclick = () => {
            downloadM3UFile(`muhurlu_liste_${lKey}.m3u`, finalM3U);
        };

    } catch (err) {
        alert("Hata: " + err.message);
    } finally {
        hideLoader();
    }
}

// 2. DOSYA İNDİRME MOTORU (YENİ EKLE)
function downloadM3UFile(filename, text) {
    const element = document.createElement('a');
    element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(text));
    element.setAttribute('download', filename);
    element.style.display = 'none';
    document.body.appendChild(element);
    element.click();
    document.body.removeChild(element);
}

    // --- YARDIMCI FONKSİYONLAR ---
    function showTab(id, btn) {
        document.querySelectorAll('.main-content > div').forEach(d => d.style.display = 'none');
        document.getElementById(id).style.display = 'block';
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        // Temizlik işlemleri
        document.querySelectorAll('.select-check').forEach(cb => cb.checked = false);
        if(id !== 'tab-detective') document.getElementById('detectiveResult').style.display = 'none';
    }

    function updateSelection() {
        const sel = document.querySelectorAll('.select-check:checked');
        document.getElementById('deleteTool').style.display = sel.length ? 'flex' : 'none';
        document.getElementById('selCount').innerText = sel.length + " seçildi";
    }

    async function saveManifestAndFirebase() {
        showLoader("Kaydediliyor...");
        const token = localStorage.getItem('gh_token') || sessionStorage.getItem('gh_token');
        const getFile = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/logolar.json`, { headers: { "Authorization": `token ${token}` } });
        let sha = ""; if(getFile.ok) { const f = await getFile.json(); sha = f.sha; }
        const content = btoa(unescape(encodeURIComponent(JSON.stringify(manifestData, null, 2))));
        await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/logolar.json`, {
            method: "PUT", headers: { "Authorization": `token ${token}` },
            body: JSON.stringify({ message: "Sync V10", content: content, sha: sha })
        });
        hideLoader(); alert("SİSTEM GÜNCELLENDİ!");
    }

    function showLoader(txt) { document.getElementById('loader').style.display='flex'; document.getElementById('loaderText').innerText=txt; }
    function hideLoader() { document.getElementById('loader').style.display='none'; }
    function logout() { localStorage.clear(); location.reload(); }
    function toggleTheme() { document.body.classList.toggle('light-mode'); }

    window.onload = () => { if(localStorage.getItem('gh_token')) { document.getElementById('entryToken').value = localStorage.getItem('gh_token'); unlock(); } };
</script>
</body>
</html>
