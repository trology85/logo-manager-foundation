<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>LOGO MANAGER - SECURE ACCESS</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root { --main-red: #ff0000; --bg-dark: #0a0a0a; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-dark); color: white; margin: 0; overflow: hidden; }

        /* GİRİŞ PERDESİ (THE VEIL) */
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; transition: 0.5s;
        }
        .lock-box { background: #1a1a1a; padding: 40px; border-radius: 20px; border-top: 4px solid var(--main-red); text-align: center; width: 350px; }
        .lock-box h2 { margin-bottom: 20px; color: var(--main-red); letter-spacing: 2px; }
        .token-input { width: 100%; padding: 12px; background: #222; border: 1px solid #333; color: white; border-radius: 8px; margin-bottom: 15px; text-align: center; box-sizing: border-box; }
        
        /* ANA PANEL (GİZLİ) */
        #mainPanel { display: flex; height: 100vh; filter: blur(10px); pointer-events: none; transition: 0.5s; }
        .sidebar { width: 260px; background: #000; padding: 20px; border-right: 1px solid #222; display: flex; flex-direction: column; }
        .main-content { flex: 1; overflow-y: auto; padding: 30px; }
        
        /* DİĞER STİLLER (Öncekiyle Aynı) */
        .nav-btn { background: none; border: none; color: #666; padding: 15px; text-align: left; cursor: pointer; border-radius: 10px; margin-bottom: 5px; width: 100%; }
        .nav-btn.active { background: #222; color: white; border-left: 5px solid var(--main-red); }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .logo-card { background: #161616; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #222; position: relative; }
        .logo-card img { width: 80px; height: 80px; object-fit: contain; }
        .btn-action { background: var(--main-red); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        .logout-btn { color: #555; font-size: 12px; cursor: pointer; margin-top: 15px; text-decoration: underline; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="lock-box">
            <h2>GİRİŞ YETKİSİ</h2>
            <p style="font-size: 12px; color: #666;">Sisteme erişmek için Token anahtarını girin.</p>
            <input type="password" id="entryToken" class="token-input" placeholder="ghp_xxxxxxxxxxxx">
            <button class="btn-action" onclick="unlock()">PERDEYİ AÇ</button>
            </div>
    </div>

    <div id="mainPanel">
        <div class="sidebar">
            <h2 style="color:red; text-align:center;">PRO PANEL</h2>
            <button id="btn-up" class="nav-btn active" onclick="showTab('tab-upload', this)">📤 Çoklu Yükle</button>
            <button id="btn-lib" class="nav-btn" onclick="showTab('tab-library', this)">📂 Kütüphane</button>
            <div style="margin-top: auto;">
                <button class="btn-action" style="background:#28a745" onclick="publishJson()">SİSTEMİ YAYINLA</button>
                <div class="logout-btn" onclick="logout()">Güvenli Çıkış (Kilitle)</div>
            </div>
        </div>

        <div class="main-content">
            <div id="tab-upload" class="tab-content active">
                <h1>Çoklu Logo Yükleme</h1>
                <div style="border: 2px dashed #333; padding: 50px; text-align:center; border-radius: 20px;" onclick="document.getElementById('fileInput').click()">
                    <p id="statusText">Dosyaları buraya bırak veya tıkla</p>
                    <input type="file" id="fileInput" multiple style="display:none" onchange="handleMultipleUpload(this.files)">
                </div>
            </div>

            <div id="tab-library" class="tab-content" style="display:none;">
                <div style="display:flex; justify-content: space-between; align-items:center;">
                    <h1>Logo Kütüphanesi</h1>
                    <select id="sortOrder" onchange="loadLogos()" style="background:#222; color:white; padding:5px; border-radius:5px;">
                        <option value="name_asc">A-Z</option>
                        <option value="date_desc">En Yeni</option>
                    </select>
                </div>
                <div id="gridContainer" class="grid-container"></div>
            </div>
        </div>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "logo-server-fixed.firebaseapp.com",
        projectId: "logo-server-fixed",
        storageBucket: "logo-server-fixed.firebasestorage.app",
        messagingSenderId: "822558792997",
        appId: "1:822558792997:web:b83cb53311bb68bbb68ecc"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // SİSTEMİ AÇ
    function unlock() {
        const input = document.getElementById('entryToken').value;
        if(input.startsWith("ghp_")) {
            localStorage.setItem('gh_token', input);
            document.getElementById('loginOverlay').style.opacity = "0";
            setTimeout(() => {
                document.getElementById('loginOverlay').style.display = "none";
                document.getElementById('mainPanel').style.filter = "none";
                document.getElementById('mainPanel').style.pointerEvents = "all";
                loadLogos(); // Sadece giriş yapılınca veriyi çek
            }, 500);
        } else {
            alert("Yanlış veya eksik Token! Perde açılmıyor.");
        }
    }

    // ÇIKIŞ VE KİLİTLE
    function logout() {
        localStorage.removeItem('gh_token');
        location.reload();
    }

    // SAYFA AÇILIŞINDA KONTROL
    window.onload = () => {
        const savedToken = localStorage.getItem('gh_token');
        if(savedToken) {
            document.getElementById('entryToken').value = savedToken;
            unlock();
        }
    };

    // LOGOLARI ÇEK (YALNIZCA YETKİLİ)
    function loadLogos() {
        const order = document.getElementById('sortOrder').value;
        let query = db.collection("logoListesi");
        
        if(order === "name_asc") query = query.orderBy("name", "asc");
        else query = query.orderBy("tarih", "desc");

        query.onSnapshot(s => {
            const container = document.getElementById('gridContainer');
            container.innerHTML = "";
            s.forEach(doc => {
                const d = doc.data();
                container.innerHTML += `<div class="logo-card"><img src="${d.url}"><p>${d.name}</p></div>`;
            });
        });
    }

    function showTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).style.display = 'block';
        btn.classList.add('active');
    }

    // ... handleMultipleUpload ve publishJson fonksiyonları (Öncekiyle aynı, token'ı localStorage'dan alır) ...
</script>
</body>
</html>
