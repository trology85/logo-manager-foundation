<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>LOGO MANAGER PRO v3</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root { --main-red: #ff0000; --bg-dark: #121212; --card-bg: #1e1e1e; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-dark); color: white; margin: 0; display: flex; height: 100vh; }
        
        /* Yan Menü (Sidebar) */
        .sidebar { width: 250px; background: #000; padding: 20px; display: flex; flex-direction: column; border-right: 1px solid #333; }
        .sidebar h2 { color: var(--main-red); font-size: 18px; text-align: center; margin-bottom: 30px; border-bottom: 2px solid var(--main-red); padding-bottom: 10px; }
        .nav-btn { background: none; border: none; color: #ccc; padding: 15px; text-align: left; cursor: pointer; font-size: 16px; border-radius: 8px; transition: 0.3s; }
        .nav-btn:hover, .nav-btn.active { background: #333; color: white; border-left: 4px solid var(--main-red); }

        /* Ana İçerik */
        .main-content { flex: 1; overflow-y: auto; padding: 30px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Dosya Yöneticisi Kart Yapısı */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; margin-top: 20px; }
        .logo-card { background: var(--card-bg); padding: 15px; border-radius: 12px; text-align: center; position: relative; transition: 0.3s; border: 1px solid #333; }
        .logo-card:hover { transform: translateY(-5px); border-color: var(--main-red); }
        .logo-card img { width: 80px; height: 80px; object-fit: contain; margin-bottom: 10px; background: #2a2a2a; border-radius: 8px; padding: 5px; }
        .logo-card p { margin: 5px 0; font-size: 14px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        /* Arama ve Filtre */
        .search-box { width: 100%; padding: 12px; background: #222; border: 1px solid #444; border-radius: 8px; color: white; margin-bottom: 20px; }

        /* Çoklu Yükleme Alanı */
        .upload-zone { border: 2px dashed #444; padding: 40px; text-align: center; border-radius: 15px; cursor: pointer; transition: 0.3s; }
        .upload-zone:hover { border-color: var(--main-red); background: #1a1a1a; }

        /* Butonlar */
        .action-btn { background: var(--main-red); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .delete-ico { position: absolute; top: 10px; right: 10px; color: #ff5555; cursor: pointer; font-size: 18px; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>LOGO PRO PANEL</h2>
    <button class="nav-btn active" onclick="showTab('tab-upload')">📤 Çoklu Logo Ekle</button>
    <button class="nav-btn" onclick="showTab('tab-library')">📂 Logo Kütüphanesi</button>
    <button class="nav-btn" onclick="showTab('tab-settings')">⚙️ Ayarlar (Token)</button>
    <div style="margin-top: auto;">
        <button id="publishBtn" class="action-btn" style="width:100%; background: #28a745;" onclick="publishJson()">SİSTEMİ YAYINLA</button>
    </div>
</div>

<div class="main-content">
    <div id="tab-upload" class="tab-content active">
        <h1>Çoklu Logo Yükle</h1>
        <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
            <p id="statusText">Resimleri buraya sürükle veya tıkla</p>
            <input type="file" id="fileInput" multiple accept="image/*" style="display:none" onchange="handleMultipleUpload(this.files)">
        </div>
        <div id="uploadList" style="margin-top: 20px;"></div>
    </div>

    <div id="tab-library" class="tab-content">
        <h1>Logo Kütüphanesi</h1>
        <input type="text" class="search-box" id="searchInput" placeholder="Kanal ara..." onkeyup="filterLogos()">
        <div id="gridContainer" class="grid-container">
            </div>
    </div>

    <div id="tab-settings" class="tab-content">
        <h1>Güvenlik Ayarları</h1>
        <p>GitHub Erişim Anahtarın (Token) burada saklanır. Kodun içinde görünmez.</p>
        <input type="password" id="tokenInput" class="search-box" placeholder="ghp_... ile başlayan anahtarını gir">
        <button class="action-btn" onclick="saveToken()">ANAHTARI KAYDET</button>
    </div>
</div>

<script>
    // --- FIREBASE AYARLARI ---
    const firebaseConfig = {
        apiKey: "SENIN_API_KEY",
        authDomain: "logo-server-fixed.firebaseapp.com",
        projectId: "logo-server-fixed",
        storageBucket: "logo-server-fixed.firebasestorage.app",
        messagingSenderId: "822558792997",
        appId: "1:822558792997:web:b83cb53311bb68bbb68ecc"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // GitHub Bilgileri
    const GITHUB_USER = "trology85";
    const GITHUB_REPO = "logo-manager-foundation";

    // Sayfa Değiştirme
    function showTab(id) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.target.classList.add('active');
    }

    // Token İşlemleri
    function saveToken() {
        const t = document.getElementById('tokenInput').value;
        localStorage.setItem('gh_token', t);
        alert("Anahtar tarayıcıya güvenle kaydedildi!");
    }

    function getToken() {
        return localStorage.getItem('gh_token');
    }

    // Çoklu Yükleme
    async function handleMultipleUpload(files) {
        const token = getToken();
        if(!token) return alert("Önce Ayarlar kısmından Token girmelisin!");

        const statusText = document.getElementById('statusText');
        
        for (let file of files) {
            statusText.innerText = `${file.name} yükleniyor...`;
            const reader = new FileReader();
            
            await new Promise((resolve) => {
                reader.readAsDataURL(file);
                reader.onload = async () => {
                    const content = reader.result.split(',')[1];
                    const path = "logos/" + file.name;

                    // GitHub'a fırlat
                    const gh = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`, {
                        method: "PUT",
                        headers: { "Authorization": `token ${token}` },
                        body: JSON.stringify({ message: "Upload: " + file.name, content: content })
                    });

                    if(gh.ok) {
                        const rawUrl = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${path}`;
                        // Firebase'e yaz
                        await db.collection("logoListesi").add({
                            name: file.name.split('.')[0], // Uzantısız isim
                            url: rawUrl,
                            tarih: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }
                    resolve();
                };
            });
        }
        statusText.innerText = "Tüm yüklemeler tamamlandı!";
        setTimeout(() => location.reload(), 2000);
    }

    // Arama Filtresi
    function filterLogos() {
        const val = document.getElementById('searchInput').value.toLowerCase();
        document.querySelectorAll('.logo-card').forEach(card => {
            const name = card.querySelector('p').innerText.toLowerCase();
            card.style.display = name.includes(val) ? "block" : "none";
        });
    }

    // Kütüphaneyi Doldur (Windows Explorer Tarzı)
    db.collection("logoListesi").orderBy("name", "asc").onSnapshot(s => {
        const container = document.getElementById('gridContainer');
        container.innerHTML = "";
        s.forEach(doc => {
            const d = doc.data();
            container.innerHTML += `
                <div class="logo-card">
                    <span class="delete-ico" onclick="deleteLogo('${doc.id}')">×</span>
                    <img src="${d.url}" onerror="this.src='https://via.placeholder.com/80?text=Hata'">
                    <p>${d.name}</p>
                </div>`;
        });
    });

    async function deleteLogo(id) {
        if(confirm("Bu logoyu silmek istediğine emin misin?")) {
            await db.collection("logoListesi").doc(id).delete();
        }
    }

    // JSON Yayınla (Önceki sistemin aynısı ama Token'ı localStorage'dan alır)
    async function publishJson() {
        const token = getToken();
        if(!token) return alert("Token eksik!");
        
        const btn = document.getElementById('publishBtn');
        btn.innerText = "YAYINLANIYOR...";
        btn.disabled = true;

        try {
            const snapshot = await db.collection("logoListesi").orderBy("name", "asc").get();
            let jsonArray = [];
            snapshot.forEach(doc => {
                const data = doc.data();
                jsonArray.push({ name: data.name, url: data.url, rev: "rev=1" });
            });

            const finalJson = JSON.stringify(jsonArray, null, 2);
            const path = "logos.json";

            const getFile = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`, {
                headers: { "Authorization": `token ${token}` }
            });
            
            let sha = "";
            if(getFile.ok) { const f = await getFile.json(); sha = f.sha; }

            await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`, {
                method: "PUT",
                headers: { "Authorization": `token ${token}` },
                body: JSON.stringify({
                    message: "JSON Updated",
                    content: btoa(unescape(encodeURIComponent(finalJson))),
                    sha: sha
                })
            });
            alert("Tüm cihazlar güncellendi!");
        } catch (e) { alert("Hata: " + e.message); }
        finally { btn.innerText = "SİSTEMİ YAYINLA"; btn.disabled = false; }
    }
</script>
</body>
</html>
